<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test4Best - Practice Test</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #a0a0a0;
            cursor: not-allowed;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .image-container {
            margin: 15px 0 20px 0;
            text-align: center;
        }

        .question-image {
            max-width: 100%;
            max-height: 350px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: none; /* Hidden by default if no image exists */
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            background: #f9f9f9;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .option-item:hover {
            background: #eef5ff;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h2>Welcome to Test4Best</h2>
        <p>Click below to start a test with 25 randomly selected questions.</p>
        <button id="start-btn">Start Test</button>
    </div>

    <div id="test-screen" class="hidden">
        <div class="header">
            <h3 id="q-number-title">Question No. 1</h3>
            <div class="controls">
                <button id="lang-toggle-btn">Switch to Hindi</button>
            </div>
        </div>

        <div id="question-box">
            <!-- Question Text -->
            <div id="question-text" class="question-text">Loading question...</div>
            
            <!-- Question Image Container -->
            <div class="image-container">
                <img id="question-image" class="question-image" src="" alt="Question Diagram">
            </div>

            <!-- Options Container -->
            <ul id="options-container" class="options-list"></ul>
        </div>

        <div class="navigation">
            <button id="prev-btn">Previous</button>
            <button id="next-btn">Next</button>
        </div>
    </div>
</div>

<script>
    let allQuestions = [];
    let testQuestions = [];
    let currentQuestionIndex = 0;
    let currentLang = 'en'; // Default language ('en' or 'hi')
    let userResponses = {};

    // Load questions on initial page load
    document.addEventListener('DOMContentLoaded', () => {
        fetchQuestions();

        document.getElementById('start-btn').addEventListener('click', startTest);
        document.getElementById('lang-toggle-btn').addEventListener('click', toggleLanguage);
        document.getElementById('prev-btn').addEventListener('click', showPreviousQuestion);
        document.getElementById('next-btn').addEventListener('click', showNextQuestion);
    });

    async function fetchQuestions() {
        try {
            const response = await fetch('questions.json');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            allQuestions = await response.json();
            console.log(`Loaded ${allQuestions.length} total questions.`);
        } catch (error) {
            console.error("Failed to load questions.json:", error);
            alert("Error loading questions. Please ensure you are running this app via a local web server (e.g. Live Server or python -m http.server).");
        }
    }

    function startTest() {
        if (!allQuestions || allQuestions.length === 0) {
            alert("Questions are not loaded yet. Please wait or refresh the page.");
            return;
        }

        // Randomly pick 25 questions from the loaded dataset
        const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        testQuestions = shuffled.slice(0, 25);
        
        currentQuestionIndex = 0;
        userResponses = {};

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');

        renderCurrentQuestion();
    }

    // RENDER QUESTION DISPLAY
    function renderCurrentQuestion() {
        if (!testQuestions || testQuestions.length === 0) return;

        const q = testQuestions[currentQuestionIndex];
        if (!q) {
            console.error(`No question found at index ${currentQuestionIndex}`);
            return;
        }

        // 1. Update Title Header
        document.getElementById('q-number-title').innerText = `Question No. ${currentQuestionIndex + 1} of ${testQuestions.length}`;

        // 2. Extract Text & Options based on current language selection
        const questionText = (currentLang === 'hi') ? (q.question_hi || q.question_en) : q.question_en;
        const optionsList = (currentLang === 'hi') ? (q.options_hi || q.options_en) : q.options_en;

        // Render Question Text
        document.getElementById('question-text').innerText = questionText;

        // 3. Handle Question Image (e.g., "images/q41_diagram.jpg")
        const imgElement = document.getElementById('question-image');
        if (q.image_url && typeof q.image_url === 'string' && q.image_url.trim() !== '') {
            imgElement.src = q.image_url;
            imgElement.style.display = 'inline-block';
        } else {
            imgElement.src = '';
            imgElement.style.display = 'none'; // Completely collapse space if no image is present
        }

        // 4. Render Options List
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        if (optionsList && Array.isArray(optionsList)) {
            optionsList.forEach((optText, idx) => {
                const li = document.createElement('li');
                li.className = 'option-item';

                const isChecked = userResponses[q.id] === idx;

                li.innerHTML = `
                    <label style="width: 100%; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="option" value="${idx}" ${isChecked ? 'checked' : ''}>
                        <span>${String.fromCharCode(65 + idx)}. ${optText}</span>
                    </label>
                `;

                li.querySelector('input').addEventListener('change', () => {
                    userResponses[q.id] = idx;
                });

                optionsContainer.appendChild(li);
            });
        }

        // 5. Update Navigation Buttons
        document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
        document.getElementById('next-btn').innerText = (currentQuestionIndex === testQuestions.length - 1) ? 'Finish' : 'Next';
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'en') ? 'hi' : 'en';
        document.getElementById('lang-toggle-btn').innerText = (currentLang === 'en') ? 'Switch to Hindi' : 'Switch to English';
        renderCurrentQuestion();
    }

    function showPreviousQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderCurrentQuestion();
        }
    }

    function showNextQuestion() {
        if (currentQuestionIndex < testQuestions.length - 1) {
            currentQuestionIndex++;
            renderCurrentQuestion();
        } else {
            alert("Test completed! Thank you.");
        }
    }
</script>
</body>
</html>
